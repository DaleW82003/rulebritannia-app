name: E2E Staging (RB GO-NO-GO)

on:
  workflow_dispatch:
  push:
    branches: ["main", "backend", "phase1-rebuild"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Static checks
        run: node scripts/static-checks.js

      - name: Feature manifest
        run: node scripts/audit/feature-manifest.js --json > manifest.json

      - name: Generate audit report
        run: node scripts/audit/generate-audit-report.mjs

      - name: Debug login (status + headers + first bytes of body)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$TEST_EMAIL" ] || [ -z "$TEST_PASSWORD" ]; then
            echo "BASE_URL/TEST_EMAIL/TEST_PASSWORD not configured — skipping debug login"
            exit 0
          fi

          # Write a temp script without heredocs (reliable in YAML)
          printf '%s\n' \
            'const base = (process.env.BASE_URL || "").replace(/\/$/, "");' \
            'const email = process.env.TEST_EMAIL;' \
            'const password = process.env.TEST_PASSWORD;' \
            'const url = `${base}/api/auth/login`;' \
            'console.log("Debug login URL:", url);' \
            '' \
            '(async () => {' \
            '  const res = await fetch(url, {' \
            '    method: "POST",' \
            '    headers: {' \
            '      "content-type": "application/json",' \
            '      "user-agent": "rb-ci/1.0",' \
            '      "accept": "application/json,text/plain,*/*",' \
            '    },' \
            '    body: JSON.stringify({ email, password }),' \
            '  });' \
            '' \
            '  const setCookie = res.headers.get("set-cookie");' \
            '  const contentType = res.headers.get("content-type");' \
            '  const server = res.headers.get("server");' \
            '  const cfRay = res.headers.get("cf-ray");' \
            '' \
            '  const text = await res.text().catch(() => "");' \
            '' \
            '  console.log("HTTP status:", res.status);' \
            '  console.log("content-type:", contentType);' \
            '  console.log("server:", server);' \
            '  console.log("cf-ray:", cfRay);' \
            '  console.log("set-cookie present:", Boolean(setCookie));' \
            '  console.log("--- body (first 800 chars) ---");' \
            '  console.log(text.slice(0, 800));' \
            '  console.log("--- end body ---");' \
            '' \
            '  if (!res.ok) process.exit(1);' \
            '})().catch((err) => {' \
            '  console.error("Debug login error:", err?.message || err);' \
            '  process.exit(1);' \
            '});' \
            > /tmp/rb-debug-login.mjs

          node /tmp/rb-debug-login.mjs

      - name: Run staging smoke (requires env)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_BACKBENCHER_EMAIL: ${{ secrets.TEST_BACKBENCHER_EMAIL }}
          TEST_BACKBENCHER_PASSWORD: ${{ secrets.TEST_BACKBENCHER_PASSWORD }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL not configured — skipping staging smoke"
            exit 0
          fi
          node scripts/test-staging.mjs

      - name: Run API spec tests (requires env)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_BACKBENCHER_EMAIL: ${{ secrets.TEST_BACKBENCHER_EMAIL }}
          TEST_BACKBENCHER_PASSWORD: ${{ secrets.TEST_BACKBENCHER_PASSWORD }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$TEST_EMAIL" ]; then
            echo "BASE_URL or TEST_EMAIL not configured — skipping API spec tests"
            exit 0
          fi
          node --test tests/api/*.spec.js

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-e2e-evidence
          path: |
            manifest.json
            audit-report*.md
            audit-report*.json
            **/test-results*.json
            **/test-results*.md
            **/reports/**
